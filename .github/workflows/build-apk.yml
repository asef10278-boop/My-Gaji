name: Build Hitung Gajiku

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak proyek baru
        run: |
          unzip -q Hitung_Gajiku_Dengan_Logo.zip -d project
          cp -a project/app project/build.gradle.kts project/settings.gradle.kts project/gradle.properties .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hitung-Gajiku-APK
          path: app/build/outputs/apk/debug/app-debug.apk
