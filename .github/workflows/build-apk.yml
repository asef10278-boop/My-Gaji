name: Build My Dompet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract My Dompet
        run: |
          unzip -q My_Dompet_Anime_Style.zip -d project
          ROOT=$(find project -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            ROOT=$(find project -type f -name settings.gradle -printf '%h\n' | head -n 1)
          fi
          cp -a "$ROOT"/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Dompet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
